services:
  postgres:
    image: postgres:16-alpine
    container_name: ebank-postgres
    environment:
      POSTGRES_USER: ebank
      POSTGRES_PASSWORD: ebank_dev_password
      POSTGRES_DB: ebank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebank -d ebank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
